<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Jakebit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="offline-page">
  <main class="offline-card">
    {{ pixel_mascot('sleepy', 150) }}
    <h1>You're <span class="accent">offline.</span></h1>
    <p class="muted">Jakebit needs a connection to load your habits. Check your internet, then try again.</p>
    <button class="btn-primary" type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
