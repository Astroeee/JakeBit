{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <section class="panel auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to see your habits.</p>
    <form method="post" class="auth-form">
      <label class="field-label" for="username">Username or email</label>
      <input id="username" type="text" name="username" autocomplete="username" required autofocus>

      <label class="field-label" for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>

      <label class="check-row"><input type="checkbox" name="remember"> Keep me logged in</label>
      <button type="submit" class="check-btn">Log in</button>
    </form>
    <p class="muted small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </section>
{% endblock %}
