{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <section class="panel auth-card">
    <h1>Reset your password</h1>
    <p class="muted">Enter your username or email, your recovery code, and a new password.</p>
    <form method="post" class="auth-form">
      <label class="field-label" for="username">Username or email</label>
      <input id="username" type="text" name="username" autocomplete="username" required autofocus>

      <label class="field-label" for="code">Recovery code</label>
      <input id="code" type="text" name="code" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" required>

      <label class="field-label" for="password">New password</label>
      <input id="password" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>

      <label class="field-label" for="confirm">Confirm new password</label>
      <input id="confirm" type="password" name="confirm" minlength="8" maxlength="128" autocomplete="new-password" required>

      <button type="submit" class="check-btn">Set new password</button>
    </form>
    <p class="muted small"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </section>
{% endblock %}
