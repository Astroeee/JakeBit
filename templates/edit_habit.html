{% extends "base.html" %}
{% block title %}Edit habit{% endblock %}
{% block content %}
  <h1>Edit habit</h1>

  <form method="post" class="habit-form">
    <input type="text" name="name" value="{{ habit['name'] }}" maxlength="100" required>
    <select name="category">
      {% for c in categories %}
        <option value="{{ c }}" {{ 'selected' if c == habit['category'] }}>{{ c }}</option>
      {% endfor %}
    </select>
    <select name="frequency">
      {% for f in frequencies %}
        <option value="{{ f }}" {{ 'selected' if f == habit['frequency'] }}>{{ 'Custom days' if f == 'custom' else f|capitalize }}</option>
      {% endfor %}
    </select>
    <label class="weekly-target" data-weekly-target hidden>
          <fieldset class="day-picker" data-custom-days hidden>
      {% for name in ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] %}
        <label class="day-chip"><input type="checkbox" name="days" value="{{ loop.index0 }}" {{ 'checked' if selected_days is defined and loop.index0 in selected_days }}><span>{{ name }}</span></label>
      {% endfor %}
    </fieldset>
      <select name="weekly_target">
        {% for n in range(1, 8) %}
          <option value="{{ n }}" {{ 'selected' if n == habit['weekly_target'] }}>{{ n }}× per week</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Save changes</button>
    <a class="btn-small" href="{{ url_for('habits.habits') }}">Cancel</a>
  </form>

  <p class="muted small">Changing the frequency also changes how streaks and rates are worked out for past days.</p>
{% endblock %}
